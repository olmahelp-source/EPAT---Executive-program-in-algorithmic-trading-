[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algoplatform"
version = "0.1.0"
description = "Modular algorithmic trading platform: brokers, OMS, risk, strategies, backtesting, optimisation, analytics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
security = ["cryptography>=42"]

[project.scripts]
algoplatform = "algoplatform.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"algoplatform.web" = ["static/*"]
